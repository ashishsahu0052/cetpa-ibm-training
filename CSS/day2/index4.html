<!doctype html>
<html>
  <head>
    <title>CSS Grid Example</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .container {
        display: grid;

        /* 3 equal columns */
        grid-template-columns: repeat(3, 1fr);

        gap: 15px;

        width: 80%;
        margin: 50px auto;
      }

      .box {
        background-color: orange;
        color: white;
        font-size: 30px;
        text-align: center;
        padding: 40px;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
      <div class="box">5</div>
      <div class="box">6</div>
    </div>
  </body>
</html>
