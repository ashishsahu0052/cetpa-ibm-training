<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pie Chart Card</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f2f2f2;
        font-family: Arial, sans-serif;
      }

      .card {
        width: 300px;
        height: 300px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .pie-chart {
        width: 180px;
        height: 180px;
        border-radius: 50%;

        /* Equal 4 sections */
        background: conic-gradient(
          #ff4757 0deg 90deg,
          #1e90ff 90deg 180deg,
          #2ed573 180deg 270deg,
          #ffa502 270deg 360deg
        );
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="pie-chart"></div>
    </div>
  </body>
</html>
