<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>Ordered List</h2>

    <h4>Numeric</h4>
    <ol type="1">
      <li>Intem 1</li>
      <li>Intem 2</li>
    </ol>
    <br /><br />
    <h4>Uppercase</h4>
    <ol type="A">
      <li>Intem 1</li>
      <li>Intem 2</li>
    </ol>
    <br /><br />
    <h4>Lowercase</h4>
    <ol type="a">
      <li>Intem 1</li>
      <li>Intem 2</li>
    </ol>
    <br /><br />
    <h4>Roman</h4>
    <ol type="I">
      <li>Intem 1</li>
      <li>Intem 2</li>  
    </ol>


    h2>Unordered List</h2>
    <h4>Disc</h4>           
    <ul> type="disc">
      <li>Intem 1</li>
      <li>Intem 2</li>
    </ul>
    <br />

    <h4>None</h4>
    <ul> type="none">
      <li>Intem 1</li>
      <li>Intem 2</li>
    </ul>
   
  </body>
</html>
